<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">앞 결과가 다음 입력이 됩니다</title>
<desc id="desc">본문과 같은 두 단계 계산입니다. 화살표는 숫자가 전달되는 방향입니다.</desc>
<rect width="1600" height="650" fill="#f5f8fc"/>
<text x="55" y="36" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="43" font-weight="700" fill="#18314b">앞 결과가 다음 입력이 됩니다</text>
<text x="55" y="102" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="400" fill="#586a7d">본문과 같은 두 단계 계산입니다. 화살표는 숫자가 전달되는 방향입니다.</text>
<rect x="55" y="230" width="200" height="185" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="75" y="250" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">입력</text>
<text x="75" y="308" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">2</text>
<rect x="355" y="230" width="270" height="185" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="375" y="250" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">첫 계산</text>
<text x="375" y="308" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">2 × 3 - 1 = 5</text>
<rect x="725" y="230" width="230" height="185" rx="15" fill="white" stroke="#087b78" stroke-width="3"/>
<text x="745" y="250" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#087b78">다음 입력</text>
<text x="745" y="308" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">5</text>
<rect x="1055" y="230" width="460" height="185" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="1075" y="250" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">두 번째 계산</text>
<text x="1075" y="308" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">5 × 2 = 10</text>
<polyline points="260,322 340,322" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="340,322 323.0,313.0 323.0,331.0" fill="#087b78"/>
<polyline points="630,322 710,322" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="710,322 693.0,313.0 693.0,331.0" fill="#087b78"/>
<polyline points="960,322 1040,322" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1040,322 1023.0,313.0 1023.0,331.0" fill="#087b78"/>
<text x="55" y="589" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="400" fill="#586a7d">첫 계산의 출력 5를 그대로 받아 다음 계산의 입력으로 씁니다.</text>
</svg>