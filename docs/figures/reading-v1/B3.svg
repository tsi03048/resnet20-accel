<text x="146" y="529" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18314b">4</text>
<rect x="390" y="230" width="350" height="330" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="410" y="250" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">전체 평균 · GAP</text>
<text x="410" y="308" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">채널 1: 8 ÷ 4 = 2</text>
<text x="410" y="351" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">채널 2: 12 ÷ 4 = 3</text>
<text x="410" y="394" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">요약값 [2, 3]</text>
<polyline points="207,287 300,287 375,317" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="375,317 362.5584123421375,302.3300682840129 355.8733801677636,319.0426487199476" fill="#087b78"/>
<polyline points="207,517 300,517 375,467" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="375,467 355.8628432302296,468.9414506867883 365.84744676228377,483.9183559848695" fill="#087b78"/>
<rect x="900" y="230" width="620" height="330" rx="15" fill="white" stroke="#087b78" stroke-width="3"/>
<text x="920" y="250" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#087b78">후보별 점수 · FC</text>
<text x="920" y="308" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">고양이: 2×1 + 3×1 = 5</text>
<text x="920" y="351" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">강아지: 2×1 + 3×0 = 2</text>
<text x="920" y="394" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">가장 큰 점수 5 → 고양이 선택</text>
<polyline points="745,395 885,395" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="885,395 868.0,386.0 868.0,404.0" fill="#087b78"/>
<text x="55" y="759" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="400" fill="#586a7d">예제 Weight와 Bias 0은 설명용입니다. 점수 5는 확률 500%라는 뜻이 아닙니다.</text>
</svg>