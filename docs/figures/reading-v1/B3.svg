<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">채널별 평균을 낸 뒤 후보별 점수를 계산합니다</title>
<desc id="desc">두 채널과 두 후보만 둔 작은 예제입니다. 실제 CIFAR-10 모델은 후보가 10개입니다.</desc>
<rect width="1600" height="820" fill="#f5f8fc"/>
<text x="55" y="36" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="43" font-weight="700" fill="#18314b">채널별 평균을 낸 뒤 후보별 점수를 계산합니다</text>
<text x="55" y="102" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="400" fill="#586a7d">두 채널과 두 후보만 둔 작은 예제입니다. 실제 CIFAR-10 모델은 후보가 10개입니다.</text>
<text x="65" y="174" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="700" fill="#245eaa">채널 1</text>
<rect x="65" y="220" width="64" height="64" rx="2" fill="white" stroke="#a5b4c5" stroke-width="3"/>
