<rect x="132" y="220" width="64" height="64" rx="2" fill="white" stroke="#a5b4c5" stroke-width="3"/>
<text x="146" y="232" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18314b">3</text>
<rect x="65" y="287" width="64" height="64" rx="2" fill="white" stroke="#a5b4c5" stroke-width="3"/>
<text x="79" y="299" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18314b">1</text>
<rect x="132" y="287" width="64" height="64" rx="2" fill="white" stroke="#a5b4c5" stroke-width="3"/>
<text x="146" y="299" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18314b">3</text>
<text x="65" y="405" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="700" fill="#087b78">채널 2</text>
<rect x="65" y="450" width="64" height="64" rx="2" fill="white" stroke="#a5b4c5" stroke-width="3"/>
<text x="79" y="462" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18314b">2</text>
<rect x="132" y="450" width="64" height="64" rx="2" fill="white" stroke="#a5b4c5" stroke-width="3"/>
<text x="146" y="462" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18314b">4</text>
<rect x="65" y="517" width="64" height="64" rx="2" fill="white" stroke="#a5b4c5" stroke-width="3"/>
<text x="79" y="529" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18314b">2</text>
