<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
<title id="title">같은 필터를 가까이 두고 다시 씁니다</title>
<desc id="desc">B1의 필터 숫자 9개를 네 출력 위치에 재사용하는 개념도입니다.</desc>
<rect width="1600" height="780" fill="#f5f8fc"/>
<text x="55" y="36" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="43" font-weight="700" fill="#18314b">같은 필터를 가까이 두고 다시 씁니다</text>
<text x="55" y="102" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="400" fill="#586a7d">B1의 필터 숫자 9개를 네 출력 위치에 재사용하는 개념도입니다.</text>
<rect x="65" y="190" width="450" height="215" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="85" y="210" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">큰 저장소</text>
<text x="85" y="268" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">필터 숫자 9개 보관</text>
<rect x="575" y="190" width="450" height="215" rx="15" fill="white" stroke="#087b78" stroke-width="3"/>
<text x="595" y="210" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#087b78">계산기 옆 작은 저장소</text>
<text x="595" y="268" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">필터 숫자 9개를 가져옴</text>
<text x="595" y="311" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">버리지 않고 보관</text>
<rect x="1085" y="190" width="450" height="215" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="1105" y="210" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">계산기</text>
<text x="1105" y="268" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">위치 1 → 2 → 3 → 4</text>
<text x="1105" y="311" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">같은 필터로 계산</text>
<polyline points="520,295 560,295" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="560,295 543.0,286.0 543.0,304.0" fill="#087b78"/>
<polyline points="1030,295 1070,295" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1070,295 1053.0,286.0 1053.0,304.0" fill="#087b78"/>
<text x="575" y="450" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="400" fill="#087b78">다음 위치에서도 보관한 같은 필터를 읽습니다.</text>
<rect x="65" y="535" width="450" height="130" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="85" y="555" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">얼마나 담나?</text>
<text x="85" y="613" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">용량 · Capacity</text>
<rect x="575" y="535" width="450" height="130" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="595" y="555" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">얼마나 빨리 옮기나?</text>
<text x="595" y="613" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">대역폭 · Bandwidth</text>
<rect x="1085" y="535" width="450" height="130" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="1105" y="555" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">얼마나 기다리나?</text>
<text x="1105" y="613" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">응답 시간 · Latency</text>
<text x="55" y="719" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="400" fill="#586a7d">재사용하면 멀리서 반복해서 가져오는 횟수를 줄일 수 있습니다. 실제 저장 위치는 설계마다 다릅니다.</text>
</svg>