<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">원래 값과 계산한 변화를 따로 보내 마지막에 더합니다</title>
<desc id="desc">본문의 작은 예: 원래 값 3, 계산한 변화 -1. 두 화살표가 만나는 곳에서 더합니다.</desc>
<rect width="1600" height="820" fill="#f5f8fc"/>
<text x="55" y="36" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="43" font-weight="700" fill="#18314b">원래 값과 계산한 변화를 따로 보내 마지막에 더합니다</text>
<text x="55" y="102" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="400" fill="#586a7d">본문의 작은 예: 원래 값 3, 계산한 변화 -1. 두 화살표가 만나는 곳에서 더합니다.</text>
<rect x="65" y="300" width="240" height="160" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="85" y="320" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">입력 X</text>
<text x="85" y="378" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">3</text>
<rect x="490" y="170" width="420" height="180" rx="15" fill="white" stroke="#245eaa" stroke-width="3"/>
<text x="510" y="190" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#245eaa">계산하는 길 · Main</text>
<text x="510" y="248" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">Conv1 → ReLU → Conv2</text>
<text x="510" y="291" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">계산한 변화: -1</text>
<rect x="490" y="455" width="420" height="160" rx="15" fill="white" stroke="#087b78" stroke-width="3"/>
<text x="510" y="475" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#087b78">원래 값을 보내는 길</text>
<text x="510" y="533" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">X = 3 그대로 보관</text>
<polyline points="310,380 380,380 380,260 475,260" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="475,260 458.0,251.0 458.0,269.0" fill="#087b78"/>
<polyline points="380,380 380,535 475,535" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="475,535 458.0,526.0 458.0,544.0" fill="#087b78"/>
<rect x="1100" y="300" width="425" height="230" rx="15" fill="white" stroke="#b95818" stroke-width="3"/>
<text x="1120" y="320" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" fill="#b95818">더하기 → ReLU</text>
<text x="1120" y="378" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">3 + (-1) = 2</text>
<text x="1120" y="421" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#18314b">ReLU 뒤에도 2</text>
<polyline points="915,260 1000,260 1000,355 1085,355" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1085,355 1068.0,346.0 1068.0,364.0" fill="#087b78"/>
<polyline points="915,535 1000,535 1000,470 1085,470" fill="none" stroke="#087b78" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1085,470 1068.0,461.0 1068.0,479.0" fill="#087b78"/>
<text x="55" y="759" dominant-baseline="hanging" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="400" fill="#586a7d">더하기 전에 -1을 0으로 바꾸면 3이 되어 결과가 달라집니다. 원래 X도 더하기까지 보관합니다.</text>
</svg>