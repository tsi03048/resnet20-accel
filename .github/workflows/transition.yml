name: Actual integer Transition blocks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  transition-real-integer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p test_transition_vectors.py -v
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: bash tb/transition_e2b_v1/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-real-integer-evidence
          path: results/transition_rtl/
