name: Historical E12-E21 checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_historical.py
      - run: python tools/run_historical.py E15 --output build/historical-E15 --reference-only
      - run: python tools/run_historical.py E19 --output build/historical-E19 --reference-only
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stage: [E12, E13, E14, E16, E17, E18, E20, E21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.stage != 'E12'
        run: sudo apt-get update && sudo apt-get install -y verilator g++ make
      - if: matrix.stage == 'E12'
        run: |
          sudo apt-get update && sudo apt-get install -y g++ make perl
          python -m pip install verilator==5.48.0
          python - <<'PY'
          import os
          from pathlib import Path
          import verilator
          root = Path(verilator.__file__).parent
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'VERILATOR={root}/bin/verilator\nVERILATOR_ROOT={root}\n')
          PY
      - run: python tools/run_historical.py ${{ matrix.stage }} --output build/historical-${{ matrix.stage }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-${{ matrix.stage }}-evidence
          path: build/historical-${{ matrix.stage }}/**/results/
